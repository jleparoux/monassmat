{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">Nouveau contrat</h1>
    <p class="page-subtitle">Associez un enfant existant ou créez-en un nouveau.</p>
  </div>
  <div class="page-actions">
    <a class="btn btn-secondary" href="/contracts">Retour aux contrats</a>
    {% if contract_id %}
      <a class="btn" href="/contracts/{{ contract_id }}/calendar">Ouvrir le calendrier</a>
    {% endif %}
  </div>
</div>

<section class="card">
  <div class="card__body">
    {% if saved %}
      <div class="notice notice--ok">Contrat créé.</div>
    {% endif %}
    <form method="post" action="/contracts/new">
      <label class="field">
        <span>Nom du contrat</span>
        <input name="contract_name" type="text" />
      </label>

      <label class="field">
        <span>Enfant</span>
        <select name="child_id" id="child-select">
          <option value="">— Créer un nouvel enfant —</option>
          {% for child in children %}
            <option value="{{ child.id }}"
              {% if selected_child_id == child.id %}selected{% endif %}>
              {{ child.name }} (né(e) le {{ child.birth_date }})
            </option>
          {% endfor %}
        </select>
      </label>

      <div id="new-child-fields">
        <div class="field-group">
          <label class="field">
            <span>Nom de l'enfant</span>
            <input name="child_name" type="text" />
          </label>
          <label class="field">
            <span>Date de naissance</span>
            <input name="child_birth_date" type="date" />
          </label>
        </div>
      </div>

      <div class="field-group">
        <label class="field">
          <span>Date de début</span>
          <input name="start_date" type="date" required />
        </label>
        <label class="field">
          <span>Date de fin</span>
          <input name="end_date" type="date" />
        </label>
      </div>

      <div class="field-group">
        <label class="field">
          <span>Heures par semaine</span>
          <input name="hours_per_week" type="number" step="0.01" required />
        </label>
        <label class="field">
          <span>Semaines par an</span>
          <input name="weeks_per_year" type="number" step="0.01" required />
        </label>
      </div>

      <label class="field">
        <span>Type d'accueil regulier</span>
        <select name="year_mode" required>
          {% for mode in year_modes %}
            <option value="{{ mode }}" {% if mode == "complete" %}selected{% endif %}>
              {% if mode == "complete" %}Accueil sur 52 semaines{% else %}Accueil sur 46 semaines ou moins{% endif %}
            </option>
          {% endfor %}
        </select>
      </label>

      <label class="field">
        <span>Tarif horaire net de base</span>
        <input name="hourly_rate" type="number" step="0.01" required />
      </label>

      <div class="field-group">
        <label class="field">
          <span>Jours par semaine</span>
          <input name="days_per_week" type="number" step="1" />
        </label>
        <label class="field">
          <span>Ancien seuil quotidien (suivi non declaratif)</span>
          <input name="majoration_threshold" type="number" step="0.01" />
        </label>
      </div>

      <div class="field-group">
        <label class="field">
          <span>Ancien coefficient de majoration (ex. 1,25)</span>
          <input name="majoration_rate" type="number" step="0.01" />
        </label>
        <label class="field">
          <span>Plafond salaire net</span>
          <input name="salary_net_ceiling" type="number" step="0.01" />
        </label>
      </div>

      <div class="field-group">
        <label class="field">
          <span>Frais repas</span>
          <input name="fee_meal_amount" type="number" step="0.01" />
        </label>
        <label class="field">
          <span>Frais entretien</span>
          <input name="fee_maintenance_amount" type="number" step="0.01" />
        </label>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="submit">Créer le contrat</button>
      </div>
    </form>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script>
  (function () {
    var sel = document.getElementById('child-select');
    var newFields = document.getElementById('new-child-fields');
    var inputs = newFields.querySelectorAll('input');

    function toggle() {
      var isNew = sel.value === '';
      newFields.style.display = isNew ? '' : 'none';
      inputs.forEach(function (i) { i.required = isNew; });
    }

    sel.addEventListener('change', toggle);
    toggle();
  })();
</script>
{% endblock %}
